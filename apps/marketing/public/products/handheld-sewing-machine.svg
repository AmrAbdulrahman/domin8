<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="220" fill="none"/>
  <!-- thread spool -->
  <circle cx="228" cy="46" r="24" fill="#eaf1ff" stroke="#2957c9" stroke-width="6"/>
  <line x1="228" y1="46" x2="228" y2="46" stroke="#2957c9" stroke-width="6"/>
  <circle cx="228" cy="46" r="8" fill="#2957c9"/>
  <line x1="228" y1="70" x2="205" y2="96" stroke="#2957c9" stroke-width="5" stroke-linecap="round"/>

  <!-- main body -->
  <rect x="62" y="80" width="180" height="58" rx="26" fill="#eaf1ff" stroke="#2957c9" stroke-width="6"/>

